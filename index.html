<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Flappy Bird</title>
    <style>
        body { 
            margin: 0; 
            background: linear-gradient(180deg, #70c5ce 0%, #306998 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas { 
            border: 4px solid #000;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            touch-action: none;
        }
        .instructions {
            position: absolute;
            top: 20px;
            color: white;
            text-align: center;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="instructions">
        <div>🕹️ SPACEBAR or TAP to flap</div>
        <div style="font-size: 14px; margin-top: 10px;">Made with pygbag + pygame-ce</div>
    </div>
    <canvas id="canvas" width="400" height="600"></canvas>
    <div id="loading" class="loading">Loading game... (first time may take 30s)</div>

    <!-- Official pygbag CDN script -->
    <script defer src="https://pygame-web.github.io/pygbag/pygbag.min.js"></script>
    
    <!-- pygbag loader -->
    <script>
        window.addEventListener('load', async () => {
            const canvas = document.getElementById('canvas');
            const loading = document.getElementById('loading');
            
            try {
                // Load and run the game
                await pygbag.run({
                    canvas: canvas,
                    main: './main2.py',  // Your game file
                    files: ['./main2.py', './assets/background-day.png', './assets/bluebird-midflap.png', './assets/pipe-green.png'],
                    cdn: 'https://pygame-web.github.io/archives/0.8/'  // Official CDN for assets/WASM
                });
                loading.style.display = 'none';  // Hide loading when ready
                console.log('Game loaded!');
            } catch (error) {
                console.error('Load error:', error);
                loading.innerText = 'Error loading game. Check console.';
            }
        });
    </script>
</body>
</html>
