<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappybird Game</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(180deg, #70c5ce 0%, #306998 100%);
            display: flex;
            flex-direction: column; /* Allow content stacking */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        canvas {
            border: 4px solid #000;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            touch-action: none;
            cursor: pointer;
            margin-top: 10px; /* Space from controls */
        }
        .instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        /* --- NEW: Difficulty Controls Styling --- */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            z-index: 5;
        }
        .controls button {
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
            border: 2px solid #fff;
            background: rgba(0,0,0,0.3);
            color: white;
            border-radius: 6px;
            transition: background 0.2s, border-color 0.2s;
        }
        .controls button:hover {
            background: rgba(0,0,0,0.5);
        }
        .controls .active {
            border-color: #ffeb3b; /* Highlight for active mode */
            background: rgba(255, 235, 59, 0.1);
        }
        /* -------------------------------------- */
    </style>
</head>
<body>
    <div class="instructions">
        🕹️SPACEBAR or TAP to flap
    </div>
    
    <div class="controls">
        <button id="easyBtn" onclick="setDifficulty('easy')">Easy</button>
        <button id="mediumBtn" onclick="setDifficulty('medium')" class="active">Medium</button>
        <button id="hardBtn" onclick="setDifficulty('hard')">Hard</button>
    </div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div id="loading" class="loading" style="display: none;">Loading assets...</div>

    <script>
        // Flappy Bird in Pure JS/HTML5 Canvas (Dec 2025 Edition)
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');

        // Game constants
        const WIDTH = 400;
        const HEIGHT = 600;
        const GRAVITY = 0.5;
        const JUMP = -10;
        const PIPE_WIDTH = 52;
        const PIPE_GAP = 180;
        
        // --- Difficulty Settings ---
        let currentPipeSpeed = 5; 
        const DIFFICULTY_SPEEDS = {
            'easy': 3,
            'medium': 5,
            'hard': 6
        };

        // UI elements for highlighting the active difficulty
        const diffButtons = {
            'easy': document.getElementById('easyBtn'),
            'medium': document.getElementById('mediumBtn'),
            'hard': document.getElementById('hardBtn'),
        };
        // ---------------------------

        // Game state
        let gameState = 'loading'; // Can be 'loading', 'starting', 'playing', 'gameover'
        let birdX = 100;
        let birdY = HEIGHT / 2;
        let birdVelocity = 0;
        let pipes = [];
        let score = 0;
        let highScore = 0;
        let frame = 0;
        let delayTimer = 3; 
        let difficulty = 'medium'; 

        // Load assets
        let bgImg = new Image();
        let birdImg = new Image();
        let pipeImg = new Image();
        let assetsLoaded = 0;
        let totalAssets = 3;

        function loadImage(src, img) {
            img.onload = () => {
                assetsLoaded++;
                if (assetsLoaded === totalAssets) {
                    loading.style.display = 'none';
                    gameState = 'starting';
                    startDelay();
                    gameLoop(); 
                }
            };
            img.onerror = () => {
                assetsLoaded++;
                if (assetsLoaded === totalAssets) {
                    loading.style.display = 'none';
                    gameState = 'starting';
                    startDelay();
                    gameLoop();
                }
            };
            img.src = src;
        }

        loadImage('assets/background-day.png', bgImg);
        loadImage('assets/bluebird-midflap.png', birdImg);
        loadImage('assets/pipe-green.png', pipeImg);

        // --- NEW: Difficulty UI Logic ---
        function updateDifficultyUI(level) {
            Object.keys(diffButtons).forEach(key => {
                diffButtons[key].classList.remove('active');
            });
            if (diffButtons[level]) {
                diffButtons[level].classList.add('active');
            }
        }
        
        function setDifficulty(level) {
            if (DIFFICULTY_SPEEDS.hasOwnProperty(level) && gameState !== 'playing') {
                difficulty = level;
                // If not playing, reset the game state to apply new speed
                if (gameState === 'starting' || gameState === 'gameover') {
                    resetGame();
                }
                updateDifficultyUI(level);
            }
        }
        // --------------------------------

        // Reset game state function
        function resetGame() {
            pipes = [];
            birdY = HEIGHT / 2;
            birdVelocity = 0;
            score = 0;
            frame = 0;
            delayTimer = 3;
            // Set the pipe speed based on the current difficulty
            currentPipeSpeed = DIFFICULTY_SPEEDS[difficulty];
        }

        // Start Delay Function
        function startDelay() {
            let countdown = setInterval(() => {
                delayTimer--;
                if (delayTimer <= 0) {
                    clearInterval(countdown);
                    delayTimer = 0; 
                }
            }, 1000);
        }

        // Input handling (keyboard + touch/mouse)
        function jump() {
            if (gameState === 'starting') {
                gameState = 'playing';
                birdVelocity = JUMP;
                // Hide difficulty controls when game starts
                document.querySelector('.controls').style.display = 'none';
            } else if (gameState === 'playing') {
                birdVelocity = JUMP;
            } else if (gameState === 'gameover') {
                gameState = 'starting';
                resetGame();
                startDelay();
                // Show difficulty controls when game restarts
                document.querySelector('.controls').style.display = 'flex';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });
        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });

        // Create pipe pair
        function createPipe() {
            const y = Math.random() * (HEIGHT - PIPE_GAP - 200) + 100;
            pipes.push({
                x: WIDTH,
                top: y,
                bottom: HEIGHT - (y + PIPE_GAP),
                scored: false
            });
        }

        // Update game logic
        function update() {
            if (gameState !== 'playing') return;

            // Bird physics
            birdVelocity += GRAVITY;
            birdY += birdVelocity;

            // Ground/ceiling collision
            if (birdY < 0 || birdY > HEIGHT - 30) {
                gameState = 'gameover'; // Change state
                highScore = Math.max(highScore, score);
            }

            // Pipes
            if (frame % 90 === 0) {
                createPipe();
            }

            pipes.forEach((pipe, index) => {
                pipe.x -= currentPipeSpeed; // Use currentPipeSpeed

                // Collision detection (Bird is approx 34px wide, 24px high)
                const birdRight = birdX + 34;
                const birdBottom = birdY + 24;
                if (birdRight > pipe.x && birdX < pipe.x + PIPE_WIDTH &&
                    (birdY < pipe.top || birdBottom > HEIGHT - pipe.bottom)) {
                    gameState = 'gameover'; // Change state
                    highScore = Math.max(highScore, score);
                }

                // Score
                if (!pipe.scored && pipe.x + PIPE_WIDTH < birdX) {
                    score++;
                    pipe.scored = true;
                }

                // Remove off-screen pipes
                if (pipe.x + PIPE_WIDTH < 0) {
                    pipes.splice(index, 1);
                }
            });

            frame++;
        }

        // Render
        function draw() {
            // Background
            ctx.fillStyle = bgImg.src ? 'white' : '#70c5ce';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            if (bgImg.complete && bgImg.naturalHeight !== 0) {
                ctx.drawImage(bgImg, 0, 0, WIDTH, HEIGHT);
            }

            // Pipes 
            pipes.forEach(pipe => {
                // Top pipe
                if (pipeImg.complete && pipeImg.naturalHeight !== 0) {
                    ctx.save();
                    ctx.translate(pipe.x + PIPE_WIDTH / 2, pipe.top);
                    ctx.scale(1, -1);
                    ctx.drawImage(pipeImg, -PIPE_WIDTH / 2, 0, PIPE_WIDTH, pipe.top);
                    ctx.restore();
                } else {
                    ctx.fillStyle = 'green';
                    ctx.fillRect(pipe.x, 0, PIPE_WIDTH, pipe.top);
                }

                // Bottom pipe
                if (pipeImg.complete && pipeImg.naturalHeight !== 0) {
                    ctx.drawImage(pipeImg, pipe.x, HEIGHT - pipe.bottom, PIPE_WIDTH, pipe.bottom);
                } else {
                    ctx.fillStyle = 'green';
                    ctx.fillRect(pipe.x, HEIGHT - pipe.bottom, PIPE_WIDTH, pipe.bottom);
                }
            });

            // Bird
            ctx.save();
            ctx.translate(birdX + 17, birdY + 12);
            ctx.rotate(gameState === 'playing' ? -birdVelocity * 0.1 : 0); 
            if (birdImg.complete && birdImg.naturalHeight !== 0) {
                ctx.drawImage(birdImg, -17, -12);
            } else {
                 ctx.fillStyle = 'yellow';
                 ctx.beginPath();
                 ctx.arc(0, 0, 12, 0, Math.PI * 2);
                 ctx.fill();
                 ctx.fillStyle = 'black';
                 ctx.beginPath();
                 ctx.arc(-4, -4, 2, 0, Math.PI * 2);
                 ctx.arc(4, -4, 2, 0, Math.PI * 2);
                 ctx.fill();
            }
            ctx.restore();

            // Score/State Messages
            ctx.fillStyle = 'white';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            
            if (gameState === 'starting' || gameState === 'playing') {
                // Display countdown or score
                if (delayTimer > 0) {
                    // Countdown display
                    ctx.fillText(`${delayTimer}`, WIDTH / 2, HEIGHT / 2 - 50);
                    ctx.font = '24px Arial';
                    ctx.fillText(`Get Ready! (${difficulty.toUpperCase()})`, WIDTH / 2, HEIGHT / 2);
                } else {
                    // Score display
                    ctx.fillText(Math.floor(score), WIDTH / 2, 80);
                }
            } else if (gameState === 'gameover') {
                // Game over screen
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, WIDTH, HEIGHT);

                ctx.fillStyle = 'white';
                ctx.font = 'bold 36px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`Score: ${Math.floor(score)}`, WIDTH / 2, HEIGHT / 2 - 80);
                ctx.fillText(`High: ${Math.floor(highScore)}`, WIDTH / 2, HEIGHT / 2 - 30);
                
                ctx.font = 'bold 28px Arial';
                ctx.fillText(`Mode: ${difficulty.toUpperCase()}`, WIDTH / 2, HEIGHT / 2 + 20);

                ctx.font = '24px Arial';
                ctx.fillText('SPACE or TAP to restart', WIDTH / 2, HEIGHT / 2 + 80);
            }
        }

        // Main game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Initial setup
        resetGame(); // Ensure initial speed is set
        loading.style.display = 'block';
    </script>
</body>
</html>
