<!DOCTYPE html>
<html lang="en">
<head>

    <title>Pygame Flappy Bird - PyScript</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    
    <style>
        body {
            display: flex;

            border: 4px solid #000;

    <py-config>

        files = ["main2.py", "./assets/background-day.png", "./assets/bluebird-midflap.png", "./assets/pipe-green.png"] -->
