<!DOCTYPE html>
<html>
<head>
    <title>Pygame Flappy Bird - PyScript</title>
    
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #306998; /* Example background color */
        }
    </style>
</head>
<body>

    <py-config>
        # **CORRECTED PACKAGE NAME**
        packages = ["pygame-ce"] 
        
        # **OPTIONAL: Fetching the file. Not strictly needed if using src=**
        # fetch:
        #   - name: flappybird_game_code
        #     files: ["main.py", "./assets/bird.png", "./assets/pipe.png", ...]
    </py-config>

    <py-script src="./main.py" type="py-game"></py-script>

</body>
</html>
