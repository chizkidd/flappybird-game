<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - PyGame-CE in PyScript</title>
    <link rel="stylesheet" href="https://pyscript.net/latest/core.css">
    <script type="module" src="https://pyscript.net/latest/core.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #306998;
        }
        .game-canvas {
            border: 2px solid #000;
            display: block;
        }
    </style>
</head>
<body>
    <py-config>
        # No 'packages' here—pygame-ce is loaded in JS/Python
        run_hydrated = true  # Enables full Pyodide features
    </py-config>

    <!-- Load pygame-ce before the game script -->
    <script>
        async function loadPygame() {
            const pyodide = await loadPyodide();
            await pyodide.loadPackage('pygame-ce');
            console.log('pygame-ce loaded!');
        }
        loadPygame();
    </script>

    <!-- Game script with py-game type for canvas -->
    <script type="py-game" src="./main2.py" id="flappy-game"></script>
</body>
</html>
